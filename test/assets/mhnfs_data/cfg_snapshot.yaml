experiment_name: mhnfs_fsmol
project_name: MHNfs
system:
  ressources:
    device: cuda
    num_workers_cpu: 0
  data:
    path: /system/user/studentwork/tscheidl/MHNfs/src/data/preprocessed/
    dir_training: training/
    dir_validation: validation/
    dir_test: test/
    name_mol_ids: mol_ids.npy
    name_target_ids: task_ids.npy
    name_labels: labels.npy
    name_mol_inputs: mol_inputs.npy
    name_dict_mol_smiles_id: dict_mol_smiles_id.pkl
    name_dict_target_id_activeMolecules: dict_task_id_activeMolecules.pkl
    name_dict_target_id_inactiveMolecules: dict_task_id_inactiveMolecules.pkl
    name_dict_target_names_id: dict_task_names_id.pkl
model:
  mol_input_dim: 2248
  associationSpace_dim: 1024
  context_size: 10841
  context_top_k: 512
  training:
    batch_size: 32
  transformer:
    activity_embedding_dim: 64
    ss_dropout: 0.1
    num_layers: 1
    stochastic_depth_prob: 0.0
    number_heads: 8
    dropout: 0.5
  encoder:
    number_hidden_neurons: 1024
    input_dropout: 0.1
    dropout: 0.5
  hopfield:
    dim_QK: 512
    num_steps: 1
    heads: 8
    beta: 0.044
    dropout: 0.5
  prediction_scaling: 0.044194173824159216
  learnable_prediction_scaling: false
  similarityModule:
    numHeads: 1
    temperature: 1.0
    aggregation: sum
    scaling: 1/N
    l2Norm: false
    posWeight: 1.0
    negWeight: 1.0
    topk: null
  layerNormBlock:
    usage: true
    affine: false
  context:
    ratio_training_molecules: 0.05
supportSet:
  supportSetSize: 16
validation:
  batch_size: 32
test:
  batch_size: 32
training:
  seed: 42
  epochs: 9999
  learning_rate: 0.0001
  weight_decay: 0.0
  batch_size: 32
  accumulate_grad_batches: 16
  lr_scheduler:
    usage: true
checkpoint_path: /system/user/studentwork/tscheidl/MHNfs/test/assets/mhnfs_data/v28_epoch26.ckpt
