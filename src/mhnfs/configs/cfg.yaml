# ============================================================
# MHNfs Configuration
# ============================================================

# Name used to identify the current experiment.
experiment_name: mhnfs_fsmol

# Project name used for experiment tracking.
project_name: MHNfs

# ============================================================
# System
# ============================================================
system:
  ressources:
    # Computation device used for training and evaluation.
    device: cuda          # change to "cpu" if no GPU available

    # Number of CPU workers used by the data loaders.
    num_workers_cpu: 0    # keep 0 on Windows to avoid multiprocessing issues

  data:
    # Root directory containing the preprocessed FS-Mol data.
    path: "/system/user/studentwork/tscheidl/MHNfs/src/data/preprocessed/"

    # Directories containing the three dataset splits.
    dir_training: "training/"
    dir_validation: "validation/"
    dir_test: "test/"

    # File containing the molecule identifiers.
    name_mol_ids: "mol_ids.npy"

    # File containing the task identifiers associated with molecules.
    name_target_ids: "task_ids.npy"

    # File containing the activity labels.
    name_labels: "labels.npy"

    # File containing the precomputed molecular input representations.
    name_mol_inputs: "mol_inputs.npy"

    # Mapping between molecule identifiers and their SMILES representations.
    name_dict_mol_smiles_id: "dict_mol_smiles_id.pkl"

    # Mapping from task identifiers to active molecules.
    name_dict_target_id_activeMolecules: "dict_task_id_activeMolecules.pkl"

    # Mapping from task identifiers to inactive molecules.
    name_dict_target_id_inactiveMolecules: "dict_task_id_inactiveMolecules.pkl"

    # Mapping between task names and task identifiers.
    name_dict_target_names_id: "dict_task_names_id.pkl"

# ============================================================
# Model
# ============================================================
model:
  # Dimension of the input molecular representation:
  # 2048 fingerprint features + 200 molecular descriptors.
  mol_input_dim: 2248           # fingerprint (2048) + descriptors (200)

  # Dimension of the internal representation used by the model.
  associationSpace_dim: 1024     # internal model dimension

  # Number of molecular representations available in the context memory.
  context_size: 10841

  # Number of context representations retrieved for further processing.
  context_top_k: 512

  training:
    # Number of training samples processed together in one batch.
    batch_size: 32

  transformer:
    # Dimension of the activity encoding used by the Transformer block.
    activity_embedding_dim: 64  # must match associationSpace_dim

    # Dropout used for the stochastic-depth/shortcut component.
    ss_dropout: 0.1

    # Number of Transformer layers.
    num_layers: 1

    # Probability used for stochastic depth.
    stochastic_depth_prob: 0.0

    # Number of attention heads in the Transformer block.
    number_heads: 8

    # Dropout probability used within the Transformer block.
    dropout: 0.5

    # Hidden dimension of the Transformer feed-forward component.
    dim_forward: 567 # maybe it is no need ?

  encoder:
    # Number of neurons in the hidden layer of the molecular encoder.
    number_hidden_neurons: 1024

    # Dropout applied to the encoder input.
    input_dropout: 0.1

    # Dropout applied within the molecular encoder.
    dropout: 0.5

  hopfield:
    # Dimension used for the query/key representations in Hopfield retrieval.
    dim_QK: 512

    # Number of Hopfield retrieval steps.
    num_steps: 2

    # Number of attention heads used for Hopfield retrieval.
    heads: 8

    # Initial/scaling beta value controlling the sharpness of retrieval.
    beta: 0.044194173824159216

    # Dropout applied within the Hopfield retrieval module.
    dropout: 0.5

  # Scaling factor applied to the prediction output.
  prediction_scaling: 0.044194173824159216

  # Whether the prediction scaling factor is learned during training.
  learnable_prediction_scaling: False

  similarityModule:
    # Number of heads used by the similarity module.
    numHeads: 1

    # Temperature used when converting similarities into predictions.
    temperature: 1.0

    # Method used to aggregate similarities between the query and support set.
    aggregation: "sum"          # sum / softmax / logsumexp

    # Scaling applied during similarity aggregation.
    scaling: "1/N"              # 1/N or 1/sqrt(N)

    # Whether L2 normalization is applied to the representations.
    l2Norm: false

    # Weight applied to positive/active support molecules.
    posWeight: 1.0

    # Weight applied to negative/inactive support molecules.
    negWeight: 1.0

    # Optional restriction to the top-k support similarities.
    topk: null                  # set to integer to use top-k, null to disable

  layerNormBlock:
    # Whether the LayerNorm block is used.
    usage: true

    # Whether LayerNorm has learnable scale and bias parameters.
    affine: false

  context:
    # Fraction of training molecules used to construct the context memory.
    ratio_training_molecules: 0.05

# ============================================================
# Support set
# ============================================================
supportSet:
  # Total number of molecules in the few-shot support set.
  # The support set is stratified according to the active/inactive
  # class distribution of each task.
  supportSetSize: 16           # fraction of molecules used as support set

# ============================================================
# Validation / Test
# ============================================================
validation:
  # Number of validation samples processed together in one batch.
  batch_size: 32

test:
  # Number of test samples processed together in one batch.
  batch_size: 32

# ============================================================
# Training
# ============================================================
training:
  # Random seed used to make the experiment reproducible.
  seed: 42

  # Maximum number of training epochs.
  epochs: 9999

  # Initial learning rate used by the optimizer.
  learning_rate: 0.0001

  # L2 regularization strength.
  weight_decay: 0.0

  # Number of training samples processed in one batch.
  batch_size: 32

  # Number of batches whose gradients are accumulated before
  # performing an optimizer update.
  accumulate_grad_batches: 16

  lr_scheduler:
    # Enable the learning-rate scheduler.
    usage: true

    # Factor by which the learning rate is multiplied when the
    # monitored validation metric stops improving.
    factor: 0.5

    # Number of validation checks without improvement before
    # reducing the learning rate.
    patience: 5

    # Validation metric monitored by the learning-rate scheduler.
    monitor: dAUPRC_val_ma
